<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Regulatory Change Radar</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}label{display:block;margin:.4rem 0}select{padding:.4rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📜 Regulatory Change Radar</h1><p>Preview impact mapping for a regulatory domain.</p><label>Jurisdiction <select id="j"><option>EU (GDPR/AI Act)</option><option>US (CCPA/state laws)</option><option>Brazil (LGPD)</option><option>Global</option></select></label><label>Domain <select id="d"><option>Data privacy</option><option>AI governance</option><option>Cybersecurity</option><option>Financial reporting</option></select></label><button onclick="go()">Map impact</button><div id="out"></div><script>function go(){const j=document.getElementById('j').value,d=document.getElementById('d').value;document.getElementById('out').textContent=`Scanning ${j} — ${d}...\n\nRecent changes detected (sample): 3 new obligations, 1 amended deadline\nControls affected: DPIA process, vendor DPAs, incident notification SOP\nRisk if unmapped: HIGH\nRecommended owners: DPO, Security Lead, Legal\n\nContinuous monitoring with control mapping: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/regulatory-change-radar">GitHub</a> · <a href="https://ziontechgroup.com/vendor-dpa-checker/">DPA Checker</a></p></body></html>
