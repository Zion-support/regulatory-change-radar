<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Regulatory Change Radar</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}label{display:block;margin:.4rem 0}select{padding:.4rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📡 Regulatory Change Radar</h1><p>See typical regulatory workload by region & industry.</p><label>Region <select id="r"><option>EU</option><option>US</option><option>Brazil</option><option>Global</option></select></label><label>Industry <select id="i"><option>IT Services</option><option>Finance</option><option>Healthcare</option><option>Retail</option></select></label><button onclick="go()">Scan</button><div id="out"></div><script>function go(){const r=document.getElementById('r').value,i=document.getElementById('i').value;const map={EU:['GDPR guidance updates','AI Act obligations phasing in','NIS2 enforcement'],US:['State privacy laws patchwork (CCPA/CPRA + new states)','SEC cyber disclosure'],Brazil:['LGPD enforcement actions rising','ANPD sandbox guidance'],Global:['Cross-border transfer mechanism updates','AI governance frameworks (ISO/IEC 42001)']};document.getElementById('out').textContent=`Active regulatory signals — ${r} / ${i}:\n${map[r].map(x=>'• '+x).join('\n')}\n\nMapped to your controls automatically with full Radar deployment: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/regulatory-change-radar">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-compliance-monitor/">Compliance Monitor</a></p></body></html>
